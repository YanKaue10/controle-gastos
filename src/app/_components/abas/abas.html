<div>
  <div class="flex gap-1 p-1 bg-black/20 rounded-2xl overflow-x-auto">
    @for (titulo of titulos(); track titulo; let i = $index) {
      <button
        (click)="selecionar(i)"
        class="flex-1 px-3 py-2.5 rounded-xl text-sm font-semibold whitespace-nowrap transition-all duration-300"
        [class]="ativa() === i
          ? 'bg-gradient-to-r from-violet-500 to-fuchsia-500 text-white shadow-lg shadow-fuchsia-500/30'
          : 'text-white/60 hover:text-white hover:bg-white/5'"
      >
        {{ titulo }}
      </button>
    }
  </div>

  <div class="pt-5">
    <ng-content />
  </div>
</div>
