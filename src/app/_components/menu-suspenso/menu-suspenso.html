<div class="relative w-full sm:w-60">
  <button
    type="button"
    (click)="alternar()"
    class="w-full flex justify-between items-center px-4 py-2.5 bg-white/10 border border-white/15 rounded-xl text-sm text-white hover:bg-white/15 transition"
  >
    <span>{{ rotulo() }}</span>
    <span class="text-white/50 transition-transform duration-300" [class.rotate-180]="aberto()">▾</span>
  </button>

  @if (aberto()) {
    <ul class="absolute z-20 mt-2 w-full bg-slate-900/95 backdrop-blur border border-white/10 rounded-xl shadow-2xl overflow-hidden">
      @for (opcao of opcoes(); track opcao) {
        <li>
          <button
            type="button"
            (click)="escolher(opcao)"
            class="w-full text-left px-4 py-2.5 text-sm text-white/80 hover:bg-gradient-to-r hover:from-violet-500/30 hover:to-fuchsia-500/30 hover:text-white transition"
          >
            {{ opcao }}
          </button>
        </li>
      }
    </ul>
  }
</div>
